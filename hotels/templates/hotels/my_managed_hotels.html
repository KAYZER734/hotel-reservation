
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>هتل‌های تحت مدیریت من</title>
</head>

<body>

    <h1>هتل‌های تحت مدیریت من</h1>

    {% for hotel in hotels %}

        <div>

            <h2>{{ hotel.name }}</h2>

            <p>
                شهر: {{ hotel.city }}
            </p>

            <p>
                آدرس: {{ hotel.address }}
            </p>

            <p>
                توضیحات: {{ hotel.description }}
            </p>

            <a href="{% url 'hotels:hotel_detail' hotel.pk %}">
                مشاهده جزئیات هتل
            </a>

        </div>

        <hr>

    {% empty %}

        <p>
            در حال حاضر هیچ هتل فعالی تحت مدیریت شما وجود ندارد.
        </p>

    {% endfor %}

    <a href="{% url 'hotels:hotel_list' %}">
        بازگشت به فهرست هتل‌ها
    </a>

</body>
</html>
