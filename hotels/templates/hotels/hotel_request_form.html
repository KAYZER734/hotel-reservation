
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ثبت درخواست هتل جدید</title>
</head>

<body>

    <h1>ثبت درخواست هتل جدید</h1>

    <p>
        اطلاعات هتل موردنظر خود را وارد کنید.
        درخواست شما پس از ثبت توسط مدیر کل بررسی خواهد شد.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            ثبت درخواست
        </button>

    </form>

    <br>

    <a href="{% url 'hotels:hotel_list' %}">
        بازگشت به فهرست هتل‌ها
    </a>

</body>

</html>
