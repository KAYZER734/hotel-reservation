
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جزئیات هتل</title>
</head>
<body>

    <h2>{{ hotel.name }}</h2>

    <p>شهر: {{ hotel.city }}</p>

    <p>آدرس: {{ hotel.address }}</p>

    <p>توضیحات: {{ hotel.description }}</p>

    <p>تاریخ ثبت: {{ hotel.created_at }}</p>

    <hr>

    <a href="{% url 'rooms:hotel_rooms' hotel_pk=hotel.pk %}">
        مشاهده اتاق های هتل
    </a>

    <br><br>

    <a href="{% url 'reviews:review_list' hotel.pk %}">
        مشاهده نظرات مشتریان
    </a>

    <a href="{% url 'hotels:hotel_list' %}">
        بازگشت به فهرست هتل ها
    </a>

</body>
</html>
