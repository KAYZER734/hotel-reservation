
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فهرست هتل ها</title>
</head>
<body>

    <h2>فهرست هتل ها</h2>

    {% for hotel in hotels %}

        <hr>

        <h3>{{ hotel.name }}</h3>

        <p>شهر: {{ hotel.city }}</p>

        <p>{{ hotel.description }}</p>

        <a href="{% url 'hotels:hotel_detail' hotel.pk %}">
            مشاهده جزئیات
        </a>

    {% empty %}

        <p>هنوز هتلی ثبت نشده است.</p>

    {% endfor %}

    <br>

    <a href="{% url 'hotels:hotel_request' %}">
        ثبت درخواست ایجاد هتل
    </a>

</body>
</html>
