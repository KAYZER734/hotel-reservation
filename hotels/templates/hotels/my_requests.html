
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>درخواست‌های من</title>
</head>
<body>

    <h1>درخواست‌های ثبت‌شده من</h1>

    {% for item in requests %}

        <div>

            <h3>{{ item.name }}</h3>

            <p>شهر: {{ item.city }}</p>

            <p>
                وضعیت:

                {{ item.get_status_display }}
            </p>

            <a href="{% url 'hotels:request_detail' item.pk %}">
                مشاهده جزئیات
            </a>

        </div>

        <hr>

    {% empty %}

        <p>شما هنوز درخواستی ثبت نکرده‌اید.</p>

    {% endfor %}

</body>
</html>
