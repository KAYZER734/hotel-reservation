<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>حذف دسترسی مدیر</title>
</head>

<body>

    <h1>حذف دسترسی مدیریتی</h1>

    <p>
        آیا مطمئن هستید که می‌خواهید دسترسی مدیریتی
        کاربر
        <strong>{{ hotel_admin.user.username }}</strong>
        را از این هتل حذف کنید؟
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            بله، حذف دسترسی
        </button>
    </form>

    <br>

    <a href="{% url 'hotels:hotel_admins' view.kwargs.pk %}">
        انصراف
    </a>

</body>
</html>
