<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>حذف هتل</title>
</head>

<body>

    <h1>حذف هتل</h1>

    <p>
        آیا مطمئن هستید که می‌خواهید هتل
        <strong>{{ hotel.name }}</strong>
        را حذف کنید؟
    </p>

    <p>
        توجه: با حذف هتل، انواع اتاق و نظرهای مرتبط نیز حذف می‌شوند.
        اگر هتل رزرو داشته باشد، حذف آن امکان‌پذیر نیست.
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            بله، هتل حذف شود
        </button>
    </form>

    <br>

    <a href="{% url 'hotels:hotel_detail' hotel.pk %}">
        انصراف و بازگشت
    </a>

</body>
</html>
