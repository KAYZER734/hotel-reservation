
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>رزرو اتاق</title>
</head>
<body>

    <h2>رزرو اتاق</h2>

    <h3>{{ room_type.title }}</h3>

    <p>هتل: {{ room_type.hotel.name }}</p>
    <p>ظرفیت هر اتاق: {{ room_type.capacity }} نفر</p>
    <p>قیمت هر شب: {{ room_type.price_per_night }}</p>
    <p>تعداد کل اتاق‌ها: {{ room_type.quantity }}</p>

    <hr>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">ثبت رزرو</button>
    </form>

    <a href="{% url 'rooms:room_list' %}">
        بازگشت به فهرست اتاق‌ها
    </a>

</body>
</html>
